# LinCold — ModSecurity (OWASP CRS 3.3) tuning for vulnerweb.com
# Loaded per-server via `modsecurity_rules_file`, on top of the server-wide CRS rules (blocking mode).
# Exclusions are narrow: specific fields on specific endpoints only.

# Passwords may legitimately contain quotes, SQL keywords, <, >, $, etc.
SecRule REQUEST_FILENAME "@rx ^/(?:login|register|account/password)$" \
    "id:1005101,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:password,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:password,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:password,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:password,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:confirm,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:confirm,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:confirm,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:confirm,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:new_password,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:new_password,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:new_password,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:new_password"

# Scan targets are URLs by design (often IP-based); the app validates them and blocks private/metadata hosts.
SecRule REQUEST_FILENAME "@streq /scans" \
    "id:1005102,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:target,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:target"

# Reports and JSON exports contain third-party scan output (error pages, banners, stack traces);
# don't treat that as a data leak from this site.
SecRule REQUEST_FILENAME "@rx ^/scans/[A-Za-z0-9]+/(?:report|download|json)$" \
    "id:1005103,phase:1,pass,nolog,t:none,ctl:ruleRemoveByTag=attack-disclosure"
